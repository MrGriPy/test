name: Build and Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/bundle.js" ]; then
            echo "::error file=build.js,line=1::Le fichier de build dist/bundle.js est manquant"
            exit 1
          fi
          echo "Build output OK: $(wc -c < dist/bundle.js) bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/

      - name: Write build summary
        if: always()
        run: |
          echo "## Résumé du build" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut** : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref** : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f "dist/bundle.js" ]; then
            echo "- **Fichier produit** : dist/bundle.js" >> $GITHUB_STEP_SUMMARY
            echo "- **Taille** : $(wc -c < dist/bundle.js) bytes" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Fichier produit** : dist/bundle.js manquant" >> $GITHUB_STEP_SUMMARY
          fi
