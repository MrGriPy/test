name: CI

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Write job status and commit ref to summary
        if: always()
        run: |
          echo "## Résumé du job" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut du job** : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref du commit** : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
